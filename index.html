
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G3 Art - Studio Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            letter-spacing: -0.011em;
            margin: 0;
        }
        .brand-shape {
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        }
        .brand-gradient {
            background: linear-gradient(135deg, #C0562F 0%, #8e3a1d 100%);
        }
        #root-error {
            display: none;
            position: fixed;
            inset: 0;
            background: #070b14;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    
    <div id="root-error">
        <div class="w-20 h-20 brand-gradient brand-shape flex items-center justify-center text-white text-3xl mb-8 shadow-2xl">
            <i class="fas fa-plug"></i>
        </div>
        <h1 class="text-2xl font-black text-white uppercase mb-4 tracking-tighter">Conectando ao Studio...</h1>
        <p class="text-slate-500 max-w-md mb-8 text-sm">Se esta tela não sumir em instantes, pode haver um problema na conexão ou na configuração da chave de API na sua hospedagem.</p>
        <div class="flex gap-4">
            <button onclick="window.location.reload()" class="bg-white text-black px-8 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-[#C0562F] hover:text-white transition-all">Recarregar</button>
            <a href="https://vercel.com" target="_blank" class="bg-slate-800 text-white px-8 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-slate-700 transition-all">Ver Painel Vercel</a>
        </div>
    </div>

    <script>
        // Monitora o carregamento do React
        window.addEventListener('load', () => {
            setTimeout(() => {
                const root = document.getElementById('root');
                if (root && root.innerHTML === "") {
                    document.getElementById('root-error').style.display = 'flex';
                }
            }, 6000);
        });

        // Captura erros fatais mas tenta não ser intrusivo
        window.onerror = function(msg) {
            if (msg.includes('process is not defined')) {
                console.warn('Erro de Process detectado. O app tentará continuar sem IA.');
                return true; // Impede a tela azul se for apenas erro de process
            }
            return false;
        };
    </script>
</body>
</html>
